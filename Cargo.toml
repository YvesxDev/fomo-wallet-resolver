[package]
name = "fomo-wallet-resolver"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
description = "Resolve a FOMO profile to its Solana wallet and verified EVM wallet"
license = "MIT"
repository = "https://github.com/YvesxDev/fomo-wallet-resolver"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
axum = "0.8"
base64 = "0.22"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
sha3 = "0.10"
solana-address-lookup-table-interface = { version = "2.2", features = ["bincode", "bytemuck"] }
solana-message = { version = "2.4", features = ["serde"] }
solana-pubkey = "2.4"
solana-transaction = { version = "2.2", features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
webbrowser = "1"
wreq = { version = "=6.0.0-rc.29", features = ["json"] }
wreq-util = "=3.0.0-rc.12"

[dev-dependencies]
solana-hash = "2.3"
solana-instruction = "2.3"
tower = { version = "0.5", features = ["util"] }
